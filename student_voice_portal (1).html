<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Voice - Butwal Multiple Campus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        bmc: {
                            50: '#f0f4f9',
                            100: '#dbe4f0',
                            600: '#1e3a8a',
                            700: '#1d3557',
                            800: '#0f224a',
                            900: '#0a1735',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // SVG Icons
        const IconShieldCheck = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );

        const IconLock = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        );

        const IconUser = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        );

        const IconCheckCircle = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const IconArrowRight = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        );

        const IconBuilding = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 v5m-4 0h4" />
            </svg>
        );

        const IconPlus = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
            </svg>
        );

        const IconSend = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
        );

        const IconSwitch = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
        );

        const IconReset = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const getInitialReports = () => [
            {
                id: 'CSIT-1020',
                title: 'Sanitary facility concern',
                faculty: 'Science & Technology',
                department: 'CSIT',
                category: 'Facilities',
                location: 'Campus Facility Block',
                description: "The sanitary facilities in the college need better maintenance and regular availability of basic supplies. Some students feel uncomfortable raising this issue directly, so I'm requesting the department to look into this matter.",
                visibility: 'Anonymous',
                reporterName: 'Anonymous',
                reporterEmail: null,
                reporterDept: 'CSIT',
                status: 'Submitted',
                createdAt: 'Today, 09:15 AM',
                response: null,
                responseDate: null,
                isMine: false
            },
            {
                id: 'CSIT-1021',
                title: 'Unpleasant smell near washroom',
                faculty: 'Science & Technology',
                department: 'CSIT',
                category: 'Facilities',
                location: 'Washroom Area',
                description: "There is a strong unpleasant smell around the washroom area, especially during the afternoon. Please look into the cleanliness and ventilation.",
                visibility: 'Identified',
                reporterName: 'Aayush Karki',
                reporterEmail: null,
                reporterDept: 'CSIT',
                status: 'Submitted',
                createdAt: 'Today, 10:30 AM',
                response: null,
                responseDate: null,
                isMine: false
            },
            {
                id: 'CSIT-1022',
                title: 'Class schedule concern',
                faculty: 'Science & Technology',
                department: 'CSIT',
                category: 'Academic / Teaching',
                location: 'CSIT Block',
                description: "There have been instances where scheduled classes have started late because the assigned instructor was unavailable. Please look into the scheduling and communication process.",
                visibility: 'Anonymous',
                reporterName: 'Anonymous',
                reporterEmail: null,
                reporterDept: 'CSIT',
                status: 'Submitted',
                createdAt: 'Yesterday, 02:15 PM',
                response: null,
                responseDate: null,
                isMine: false
            },
            {
                id: 'CSIT-1023',
                title: 'Projector not working in Room 204',
                faculty: 'Science & Technology',
                department: 'CSIT',
                category: 'Classroom Environment',
                location: 'Room 204',
                description: "The projector in Room 204 has not been working properly, making it difficult to follow presentations and course materials.",
                visibility: 'Identified',
                reporterName: 'Sujal Thapa',
                reporterEmail: null,
                reporterDept: 'CSIT',
                status: 'Acknowledged',
                createdAt: 'Yesterday, 11:00 AM',
                response: 'The department has acknowledged the issue and IT support will inspect the projector.',
                responseDate: 'Yesterday, 03:30 PM',
                isMine: false
            }
        ];

        const getInitialSuggestions = () => [
            {
                id: 'SUG-195',
                title: 'Extend Central Library Hours During Exams',
                description: 'Requesting library opening hours to be extended until 7:00 PM during mid-term and final examinations.',
                faculty: 'General Campus',
                department: 'Library',
                supportersCount: 14,
                isSupportedByMe: false,
                status: 'Planned',
                author: 'Verified Student',
                visibility: 'Public',
                response: 'Library administration agreed to extend hours starting next week.',
                responseDate: '1 day ago',
                createdAt: '5 days ago',
                isMine: false
            }
        ];

        function App() {
            const [currentRole, setCurrentRole] = useState('student');
            const [studentTab, setStudentTab] = useState('dashboard');
            const [deptTab, setDeptTab] = useState('dashboard');

            const [reports, setReports] = useState(getInitialReports);
            const [suggestions, setSuggestions] = useState(getInitialSuggestions);
            const [selectedReportId, setSelectedReportId] = useState('CSIT-1020');
            const [selectedSuggestionId, setSelectedSuggestionId] = useState('SUG-195');

            const [feedbackMsg, setFeedbackMsg] = useState(null);

            // Pre-filled concern form ready for live input
            const [reportForm, setReportForm] = useState({
                title: 'Difficulty focusing during class',
                faculty: 'Science & Technology',
                department: 'CSIT',
                category: 'Classroom Environment',
                location: 'CSIT Lecture Hall',
                description: "I'm unable to focus on class because some classmates are making too much noise during study. I'd like the department to look into this matter.",
                visibility: 'Anonymous'
            });

            // Pre-filled suggestion form ready for live input
            const [suggestionForm, setSuggestionForm] = useState({
                title: 'IoT & Robotics Workshop',
                description: 'Organize a practical IoT and robotics workshop so students can gain hands-on experience with embedded systems, sensors, and robotics.',
                visibility: 'Public'
            });

            const [deptReplyText, setDeptReplyText] = useState('The department has reviewed the concern and will take appropriate measures to maintain a respectful and productive classroom environment.');
            const [deptSuggReplyText, setDeptSuggReplyText] = useState('The CSIT department has evaluated the suggestion and agreed to schedule an IoT hands-on workshop next month in coordination with the IT club.');

            const showToast = (msg) => {
                setFeedbackMsg(msg);
                setTimeout(() => setFeedbackMsg(null), 3500);
            };

            const handleResetDemo = () => {
                setReports(getInitialReports());
                setSuggestions(getInitialSuggestions());
                setSelectedReportId('CSIT-1020');
                setSelectedSuggestionId('SUG-195');
                setReportForm({
                    title: 'Difficulty focusing during class',
                    faculty: 'Science & Technology',
                    department: 'CSIT',
                    category: 'Classroom Environment',
                    location: 'CSIT Lecture Hall',
                    description: "I'm unable to focus on class because some classmates are making too much noise during study. I'd like the department to look into this matter.",
                    visibility: 'Anonymous'
                });
                setSuggestionForm({
                    title: 'IoT & Robotics Workshop',
                    description: 'Organize a practical IoT and robotics workshop so students can gain hands-on experience with embedded systems, sensors, and robotics.',
                    visibility: 'Public'
                });
                setDeptReplyText('The department has reviewed the concern and will take appropriate measures to maintain a respectful and productive classroom environment.');
                setDeptSuggReplyText('The CSIT department has evaluated the suggestion and agreed to schedule an IoT hands-on workshop next month in coordination with the IT club.');
                showToast("Demo state reset to original defaults.");
            };

            const handleSubmitReport = (e) => {
                e.preventDefault();
                const targetId = 'CSIT-1042';

                const newReportObj = {
                    id: targetId,
                    title: reportForm.title || 'Difficulty focusing during class',
                    faculty: reportForm.faculty || 'Science & Technology',
                    department: reportForm.department || 'CSIT',
                    category: reportForm.category || 'Classroom Environment',
                    location: reportForm.location || 'CSIT Lecture Hall',
                    description: reportForm.description,
                    visibility: reportForm.visibility,
                    reporterName: reportForm.visibility === 'Anonymous' ? 'Anonymous' : 'Shyam Chaudhary',
                    reporterEmail: reportForm.visibility === 'Anonymous' ? null : 'shyam.chaudhary@bmc.edu.np',
                    reporterDept: 'CSIT',
                    status: 'Submitted',
                    createdAt: 'Just now',
                    response: null,
                    responseDate: null,
                    isMine: true
                };

                setReports([newReportObj, ...reports]);
                setSelectedReportId(targetId);
                setStudentTab('report-submitted');
                showToast("Concern submitted successfully.");
            };

            const handlePublishSuggestion = (e) => {
                e.preventDefault();
                if (!suggestionForm.title.trim() || !suggestionForm.description.trim()) return;

                const targetId = 'SUG-198';
                const newSuggestion = {
                    id: targetId,
                    title: suggestionForm.title.trim(),
                    description: suggestionForm.description.trim(),
                    faculty: 'Science & Technology',
                    department: 'CSIT',
                    supportersCount: 0,
                    isSupportedByMe: false,
                    status: 'Under Review',
                    author: 'Verified Student',
                    visibility: 'Public',
                    response: null,
                    responseDate: null,
                    createdAt: 'Just now',
                    isMine: true
                };

                setSuggestions([newSuggestion, ...suggestions]);
                setSelectedSuggestionId(targetId);
                setStudentTab('suggestion-published');
                showToast("Suggestion published successfully.");
            };

            const handleAcknowledge = (id) => {
                setReports(reports.map(r => r.id === id ? { ...r, status: 'Acknowledged' } : r));
                showToast("Report acknowledged.");
            };

            const handleSendDeptReply = (id) => {
                setReports(reports.map(r => {
                    if (r.id === id) {
                        return { 
                            ...r, 
                            response: deptReplyText, 
                            responseDate: 'Just now',
                            status: r.status === 'Submitted' ? 'Acknowledged' : r.status
                        };
                    }
                    return r;
                }));
                showToast("Department response attached successfully.");
            };

            const handleUpdateStatus = (id, newStatus) => {
                setReports(reports.map(r => r.id === id ? { ...r, status: newStatus } : r));
                showToast(`Report status updated to ${newStatus}`);
            };

            const handleToggleSupport = (id) => {
                setSuggestions(suggestions.map(s => {
                    if (s.id === id) {
                        if (s.isSupportedByMe) {
                            showToast("You already support this suggestion.");
                            return s;
                        }
                        showToast("Thank you for supporting this suggestion!");
                        return {
                            ...s,
                            isSupportedByMe: true,
                            supportersCount: s.supportersCount + 1
                        };
                    }
                    return s;
                }));
            };

            const handleUpdateSuggestionStatus = (id, newStatus) => {
                setSuggestions(suggestions.map(s => s.id === id ? { ...s, status: newStatus } : s));
                showToast(`Suggestion status updated to ${newStatus}`);
            };

            const handleSendDeptSuggReply = (id) => {
                setSuggestions(suggestions.map(s => {
                    if (s.id === id) {
                        return { 
                            ...s, 
                            response: deptSuggReplyText, 
                            responseDate: 'Just now' 
                        };
                    }
                    return s;
                }));
                showToast("Official response published successfully.");
            };

            const selectedReport = reports.find(r => r.id === selectedReportId) || reports[0];
            const selectedSuggestion = suggestions.find(s => s.id === selectedSuggestionId) || suggestions[0];

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 relative">
                    {feedbackMsg && (
                        <div className="fixed top-16 right-4 z-50 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl border border-slate-700 animate-fadeIn flex items-center gap-2">
                            <IconCheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
                            <span>{feedbackMsg}</span>
                        </div>
                    )}

                    <header className="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
                        <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
                                    <IconBuilding className="w-4 h-4" />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold text-sm tracking-tight text-white">Student Voice</span>
                                        <span className="text-[10px] bg-slate-800 border border-slate-700 text-slate-300 px-1.5 py-0.5 rounded font-mono">
                                            BMC
                                        </span>
                                    </div>
                                    <p className="text-[10px] text-slate-400 hidden sm:block">
                                        Butwal Multiple Campus
                                    </p>
                                </div>
                            </div>

                            {/* Role Switch Toggle Icon */}
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={() => setCurrentRole(currentRole === 'student' ? 'department' : 'student')}
                                    title={currentRole === 'student' ? 'Switch to Department View' : 'Switch to Student View'}
                                    className="p-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-colors cursor-pointer flex items-center justify-center border border-slate-700/60"
                                    aria-label="Switch view"
                                >
                                    <IconSwitch className="w-4 h-4" />
                                </button>
                            </div>
                        </div>

                        {/* Navigation Sub-bar */}
                        <div className="bg-slate-800/90 border-t border-slate-700/80 px-4">
                            <div className="max-w-5xl mx-auto flex items-center justify-between">
                                {currentRole === 'student' ? (
                                    <nav className="flex space-x-1 py-1.5 text-xs">
                                        <button 
                                            onClick={() => setStudentTab('dashboard')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                studentTab === 'dashboard' ? 'bg-slate-900 text-white font-semibold shadow-sm' : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            Dashboard
                                        </button>
                                        <button 
                                            onClick={() => setStudentTab('report')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                studentTab === 'report' ? 'bg-slate-900 text-white font-semibold shadow-sm' : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            Share a Concern
                                        </button>
                                        <button 
                                            onClick={() => setStudentTab('suggestions')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                studentTab === 'suggestions' || studentTab === 'create-suggestion' || studentTab === 'suggestion-published' || studentTab === 'suggestion-detail'
                                                    ? 'bg-slate-900 text-white font-semibold shadow-sm' 
                                                    : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            Public Suggestions
                                        </button>
                                        <button 
                                            onClick={() => setStudentTab('my-reports')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                studentTab === 'my-reports' || studentTab === 'report-submitted' || studentTab === 'report-detail'
                                                    ? 'bg-slate-900 text-white font-semibold shadow-sm' 
                                                    : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            My Submissions
                                        </button>
                                    </nav>
                                ) : (
                                    <nav className="flex space-x-1 py-1.5 text-xs">
                                        <button 
                                            onClick={() => setDeptTab('dashboard')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                deptTab === 'dashboard' || deptTab === 'reports' || deptTab === 'report-detail' ? 'bg-slate-900 text-white font-semibold shadow-sm' : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            Incoming Reports
                                        </button>
                                        <button 
                                            onClick={() => setDeptTab('suggestions')}
                                            className={`px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                deptTab === 'suggestions' || deptTab === 'suggestion-detail' ? 'bg-slate-900 text-white font-semibold shadow-sm' : 'text-slate-300 hover:text-white'
                                            }`}
                                        >
                                            Public Suggestions
                                        </button>
                                    </nav>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
                        {currentRole === 'student' ? (
                            <StudentView 
                                studentTab={studentTab}
                                setStudentTab={setStudentTab}
                                reports={reports}
                                suggestions={suggestions}
                                selectedReport={selectedReport}
                                setSelectedReportId={setSelectedReportId}
                                selectedSuggestion={selectedSuggestion}
                                setSelectedSuggestionId={setSelectedSuggestionId}
                                reportForm={reportForm}
                                setReportForm={setReportForm}
                                suggestionForm={suggestionForm}
                                setSuggestionForm={setSuggestionForm}
                                handleSubmitReport={handleSubmitReport}
                                handlePublishSuggestion={handlePublishSuggestion}
                                handleToggleSupport={handleToggleSupport}
                            />
                        ) : (
                            <DepartmentView 
                                deptTab={deptTab}
                                setDeptTab={setDeptTab}
                                reports={reports}
                                suggestions={suggestions}
                                selectedReport={selectedReport}
                                setSelectedReportId={setSelectedReportId}
                                selectedSuggestion={selectedSuggestion}
                                setSelectedSuggestionId={setSelectedSuggestionId}
                                handleAcknowledge={handleAcknowledge}
                                deptReplyText={deptReplyText}
                                setDeptReplyText={setDeptReplyText}
                                handleSendDeptReply={handleSendDeptReply}
                                handleUpdateStatus={handleUpdateStatus}
                                deptSuggReplyText={deptSuggReplyText}
                                setDeptSuggReplyText={setDeptSuggReplyText}
                                handleSendDeptSuggReply={handleSendDeptSuggReply}
                                handleUpdateSuggestionStatus={handleUpdateSuggestionStatus}
                            />
                        )}
                    </main>

                    <footer className="bg-white border-t border-slate-200 py-3 text-slate-500 text-xs mt-auto">
                        <div className="max-w-5xl mx-auto px-4 flex justify-between items-center text-[11px]">
                            <span>Student Voice • Butwal Multiple Campus</span>
                            <div className="flex items-center gap-3">
                                <span className="text-slate-400 font-medium">Academic Portal</span>
                                <button 
                                    onClick={handleResetDemo}
                                    title="Reset Demo Data"
                                    aria-label="Reset Demo Data"
                                    className="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer border border-slate-200"
                                >
                                    <IconReset className="w-3.5 h-3.5" />
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        function StudentView({
            studentTab,
            setStudentTab,
            reports,
            suggestions,
            selectedReport,
            setSelectedReportId,
            selectedSuggestion,
            setSelectedSuggestionId,
            reportForm,
            setReportForm,
            suggestionForm,
            setSuggestionForm,
            handleSubmitReport,
            handlePublishSuggestion,
            handleToggleSupport
        }) {
            if (studentTab === 'dashboard') {
                const mySubmissions = [
                    ...reports.filter(r => r.isMine).map(r => ({ ...r, type: 'report' })),
                    ...suggestions.filter(s => s.isMine).map(s => ({ ...s, type: 'suggestion' }))
                ];

                return (
                    <div className="space-y-5 animate-fadeIn">
                        <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h1 className="text-xl font-bold text-slate-900 tracking-tight">
                                    Student Voice Portal
                                </h1>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    Raise a concern privately or put an idea forward for your campus community.
                                </p>
                            </div>
                            <div className="shrink-0 flex items-center gap-2.5 bg-slate-50 border border-slate-200 px-3.5 py-2 rounded-xl">
                                <IconShieldCheck className="w-4 h-4 text-emerald-600 shrink-0" />
                                <div className="text-[11px]">
                                    <div className="font-bold text-slate-800">Shyam Chaudhary</div>
                                    <div className="text-slate-500 text-[10px]">CSIT • Verified Student</div>
                                    <div className="text-slate-400 text-[10px]">shyam.chaudhary@bmc.edu.np</div>
                                </div>
                            </div>
                        </div>

        function Timeline({ currentStatus }) {
            const stages = [
                { key: 'Submitted', label: 'Submitted' },
                { key: 'Acknowledged', label: 'Acknowledged' },
                { key: 'In Progress', label: 'In Progress' },
                { key: 'Resolved', label: 'Resolved' }
            ];

            const getStageIndex = (s) => {
                if (s === 'Submitted') return 0;
                if (s === 'Acknowledged') return 1;
                if (s === 'In Progress') return 2;
                if (s === 'Resolved') return 3;
                return 0;
            };

            const currentIndex = getStageIndex(currentStatus);

            return (
                <div className="py-1 px-1">
                    <div className="relative flex items-center justify-between">
                        <div className="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-slate-200 w-full z-0"></div>
                        <div 
                            className="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-blue-600 z-0 transition-all duration-300"
                            style={{ width: `${(currentIndex / (stages.length - 1)) * 100}%` }}
                        ></div>

                        {stages.map((stage, idx) => {
                            const isPassed = idx <= currentIndex;
                            const isCurrent = idx === currentIndex;
                            return (
                                <div key={stage.key} className="relative z-10 flex flex-col items-center">
                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold transition-all shadow-sm ${
                                        isCurrent 
                                            ? 'bg-blue-600 text-white ring-4 ring-blue-100 scale-110' 
                                            : isPassed 
                                                ? 'bg-emerald-600 text-white' 
                                                : 'bg-white border-2 border-slate-300 text-slate-400'
                                    }`}>
                                        {isPassed ? (idx === currentIndex && stage.key !== 'Resolved' ? idx + 1 : '✓') : idx + 1}
                                    </div>
                                    <div className="text-center mt-1.5">
                                        <div className={`text-[10px] font-bold ${isPassed ? 'text-slate-900' : 'text-slate-400'}`}>
                                            {stage.label}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function StatusBadge({ status }) {
            let colorClasses = "bg-slate-100 text-slate-700 border-slate-200";

            if (status === 'Submitted') colorClasses = "bg-blue-50 text-blue-700 border-blue-200";
            else if (status === 'Acknowledged') colorClasses = "bg-indigo-50 text-indigo-700 border-indigo-200";
            else if (status === 'In Progress') colorClasses = "bg-amber-50 text-amber-800 border-amber-200";
            else if (status === 'Resolved' || status === 'Implemented') colorClasses = "bg-emerald-50 text-emerald-800 border-emerald-200";
            else if (status === 'Planned' || status === 'Under Review') colorClasses = "bg-slate-100 text-slate-800 border-slate-200";

            return (
                <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border ${colorClasses}`}>
                    {status}
                </span>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
